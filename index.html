<!DOCTYPE html>
<html lang="it">
<head>

  <title>BiliardinoPro – Torneo 16 Squadre</title>

  <!-- Font Inter -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body class="min-h-screen bg-slate-100 text-slate-900 pb-20">

      <path d="M20 6 9 17l-5-5" />

    <span id="toast-text"></span>
  </div>

  <!-- Header Superiore Fisso -->
  <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-slate-200/70">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
      <!-- Logo e Titolo -->
      <div class="flex items-center gap-2.5">
        <div class="bg-blue-600 text-white p-1.5 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-black tracking-tight text-slate-800 leading-none">
            Biliardino<span class="text-blue-600">Pro</span>
          </h1>
          <p class="text-[11px] text-slate-400 font-medium hidden sm:block">
            Torneo 16 Squadre • Risultati Live

      <!-- Stato Firebase + Pulsanti Azione -->

        <span id="cloud-badge" title="Connessione a Firebase in corso..." class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold border bg-blue-50 text-blue-700 border-blue-200">

        <button type="button" id="btn-share" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg font-medium text-sm bg-blue-50 text-blue-700 hover:bg-blue-100 transition-colors">

            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" />

        <button type="button" id="btn-admin" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg font-medium text-sm transition-all bg-slate-100 text-slate-700 hover:bg-slate-200">

    <!-- Barra di Navigazione delle 5 Pagine -->
    <nav aria-label="Navigazione principale torneo" class="bg-slate-50/90 border-t border-slate-200/70">

  <!-- Contenuto Principale delle Pagine -->
  <main id="app-main" class="max-w-6xl mx-auto px-4 py-6">
    <div class="min-h-[60vh] flex items-center justify-center">

        <p class="text-slate-500 font-medium text-sm">Connessione a Firebase in corso...</p>

  <!-- Modale Accesso Admin -->
  <div id="modal-admin" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">

        <h2 class="text-lg font-bold text-slate-800">Accesso Organizzatore</h2>
        <button type="button" id="close-admin-modal" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-500" aria-label="Chiudi">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div class="p-6">
        <form id="form-admin-login" class="space-y-4">
          <p class="text-sm text-slate-500">
            Inserisci la password amministratore per inserire i risultati e rinominare le squadre.
          </p>
          <div>
            <label for="input-admin-pwd" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
            <input
              type="password"
              id="input-admin-pwd"
              autocomplete="new-password"
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all"

  <!-- Modale Modifica Nome Squadra -->
  <div id="modal-edit-team" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="text-lg font-bold text-slate-800">Modifica Nome Squadra</h2>
        <button type="button" id="close-edit-team-modal" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-500" aria-label="Chiudi">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div class="p-6">
        <form id="form-edit-team" class="space-y-4">
          <div>
            <label for="input-team-name" class="block text-sm font-semibold text-slate-700 mb-1">Nuovo nome</label>
            <div class="flex items-center gap-3">
              <div class="bg-slate-100 p-2.5 rounded-lg text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
              </div>
              <input
                type="text"
                id="input-team-name"
                class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all font-medium text-slate-800"
                placeholder="Es. Anselmo - Niero"
              />
            </div>
          </div>
          <div class="flex gap-3 pt-2">
            <button type="button" id="cancel-edit-team" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-lg transition-colors">
              Annulla
            </button>
            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5" />
              </svg>
              <span>Salva</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Logica Applicativa + Sincronizzazione Real-Time Firebase -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Configurazione Firebase del Torneo ---
    const firebaseConfig = {
      apiKey: "AIzaSyBQO6UdfuITk2TDdZds-w0R232AZg9KLsU",
      authDomain: "torneo-biliardino-8ec32.firebaseapp.com",
      projectId: "torneo-biliardino-8ec32",
      storageBucket: "torneo-biliardino-8ec32.firebasestorage.app",
      messagingSenderId: "1097642543869",
      appId: "1:1097642543869:web:8a2830bcb02c6fc5438c94"
    };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'torneo-biliardino-8ec32';

    let auth = null;
    let db = null;

    try {
      const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (err) {
      console.error('Errore inizializzazione Firebase:', err);
    }

    // --- Icone SVG Riutilizzabili ---
    const ICONS = {
      trophy: (size = 20, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>`,
      layoutGrid: (size = 16, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>`,
      calendar: (size = 16, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>`,
      barChart: (size = 16, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>`,
      bookOpen: (size = 16, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
      lock: (size = 16, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
      unlock: (size = 16, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>`,
      edit: (size = 13, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>`,
      medal: (size = 40, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/></svg>`,
      arrowDown: (size = 15, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>`,
      arrowRight: (size = 15, cls = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`
    };

    // --- Nomi delle 16 Squadre Partecipanti ---
    const DEFAULT_TEAM_NAMES = {
      '1': 'Anselmo - Niero',
      '2': 'Calò - Sciacca',
      '3': 'Scammacca - Troisi',
      '4': 'Cursaro - Tretola',
      '5': 'Armento - Palumbo',
      '6': 'Corrado - Lazzari',
      '7': 'Pentangelo - Galante',
      '8': 'Garofalo - Lepore',
      '9': 'Crescenzi - Siliquini',
      '10': 'Garia - T.Col. Iannucci',
      '11': 'Porcu - Cau',
      '12': 'Casini - Riacà',
      '13': 'Durante - Lavigna',
      '14': 'Basilicata - De Lisa',
      '15': 'Tessitore - Secchi',
      '16': 'Dionisi M. - Cucurachi'
    };

    // --- Generazione Dati Iniziali (4 Gironi da 4, Andata e Ritorno) ---
    function createDefaultData() {
      const teams = {};
      const teamIds = [];
      for (let i = 1; i <= 16; i++) {
        const id = i.toString();
        teams[id] = { name: DEFAULT_TEAM_NAMES[id] };
        teamIds.push(id);
      }

      // Rimescola casualmente le squadre (Algoritmo Fisher-Yates)
      for (let i = teamIds.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [teamIds[i], teamIds[j]] = [teamIds[j], teamIds[i]];
      }

      const groups = {
        A: teamIds.slice(0, 4),
        B: teamIds.slice(4, 8),
        C: teamIds.slice(8, 12),
        D: teamIds.slice(12, 16)
      };

      const groupMatches = {};
      Object.keys(groups).forEach((g) => {
        const t = groups[g];
        const schedule = [
          { round: 1, pairs: [[0, 1], [2, 3]] },
          { round: 2, pairs: [[0, 2], [1, 3]] },
          { round: 3, pairs: [[0, 3], [1, 2]] }
        ];

        schedule.forEach(({ round, pairs }) => {
          pairs.forEach(([i, j]) => {
            // Partita di Andata
            groupMatches[`${g}_${t[i]}_${t[j]}_H`] = {
              group: g,
              round,
              leg: 'Andata',
              t1: t[i],
              t2: t[j],
              s1: '',
              s2: ''
            };
            // Partita di Ritorno
            groupMatches[`${g}_${t[j]}_${t[i]}_A`] = {
              group: g,
              round: round + 3,
              leg: 'Ritorno',
              t1: t[j],
              t2: t[i],
              s1: '',
              s2: ''
            };
          });
        });
      });

      const koMatches = {
        QF1: { s1: '', s2: '' },
        QF2: { s1: '', s2: '' },
        QF3: { s1: '', s2: '' },
        QF4: { s1: '', s2: '' },
        SF1: { s1: '', s2: '' },
        SF2: { s1: '', s2: '' },
        F: { s1: '', s2: '' }
      };

      return { teams, groups, groupMatches, koMatches };
    }

    // --- Stato Globale dell'Applicazione ---
    const state = {
      user: null,
      data: null,
      isAdmin: false,
      cloudStatus: 'connecting', // 'connecting' | 'connected' | 'error'
      activePage: 'tabellone',   // 'tabellone' | 'calendario' | 'classifiche' | 'fase_finale' | 'regolamento'
      calendarGroup: 'A',        // 'A' | 'B' | 'C' | 'D'
      legFilter: 'Tutte',        // 'Tutte' | 'Andata' | 'Ritorno'
      editingTeamId: null
    };

    // --- Utility Sicurezza HTML e Toast ---
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    let toastTimeout = null;
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const textEl = document.getElementById('toast-text');
      if (!container || !textEl) return;
      textEl.textContent = msg;
      container.classList.remove('hidden');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        container.classList.add('hidden');
      }, 3500);
    }

    function updateCloudBadge() {
      const badge = document.getElementById('cloud-badge');
      const dot = document.getElementById('cloud-dot');
      const text = document.getElementById('cloud-text');
      if (!badge || !dot || !text) return;

      badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold border ';
      if (state.cloudStatus === 'connected') {
        badge.className += 'bg-emerald-50 text-emerald-700 border-emerald-200';
        badge.title = 'Database Firebase connesso: tutte le modifiche vengono salvate in tempo reale';
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        text.textContent = 'Firebase Connesso';
      } else if (state.cloudStatus === 'connecting') {
        badge.className += 'bg-blue-50 text-blue-700 border-blue-200';
        badge.title = 'Connessione a Firebase in corso...';
        dot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-ping';
        text.textContent = 'Connessione...';
      } else {
        badge.className += 'bg-rose-50 text-rose-700 border-rose-200';
        badge.title = 'Verifica le regole Firestore e Authentication Anonima sulla console Firebase';
        dot.className = 'w-2 h-2 rounded-full bg-rose-500';
        text.textContent = 'Verifica Permessi';
      }
    }

    function updateAdminButton() {
      const btn = document.getElementById('btn-admin');
      const icon = document.getElementById('btn-admin-icon');
      const label = document.getElementById('btn-admin-label');
      if (!btn || !icon || !label) return;

    // --- Calcolo Classifiche & Criteri Parità (Art. 4) ---
    function calculateStandings(group) {
      if (!state.data) return [];
      const teamIds = state.data.groups[group];
      const standings = teamIds.map((id) => ({
        id,
        name: state.data.teams[id]?.name || DEFAULT_TEAM_NAMES[id] || `Squadra ${id}`,
        p: 0,
        w: 0,
        l: 0,
        pts: 0,
        gf: 0,
        ga: 0,
        gd: 0
      }));

      const teamMap = {};
      standings.forEach((s) => {
        teamMap[s.id] = s;
      });

      const completedGroupMatches = Object.values(state.data.groupMatches).filter(
        (m) => m.group === group && m.s1 !== '' && m.s2 !== ''
      );

      completedGroupMatches.forEach((m) => {
        const s1 = parseInt(m.s1, 10);
        const s2 = parseInt(m.s2, 10);
        if (isNaN(s1) || isNaN(s2)) return;

        const t1 = teamMap[m.t1];
        const t2 = teamMap[m.t2];
        if (!t1 || !t2) return;

        t1.p++;
        t2.p++;
        t1.gf += s1;
        t1.ga += s2;
        t2.gf += s2;
        t2.ga += s1;
        t1.gd = t1.gf - t1.ga;
        t2.gd = t2.gf - t2.ga;

        const max = Math.max(s1, s2);
        if (s1 > s2) {
          t1.w++;
          t2.l++;
          if (max <= 10) {
            t1.pts += 3;
          } else {
            t1.pts += 2;
            t2.pts += 1;
          }
        } else if (s2 > s1) {
          t2.w++;
          t1.l++;
          if (max <= 10) {
            t2.pts += 3;
          } else {
            t2.pts += 2;
            t1.pts += 1;
          }
        } else {
          t1.pts += 1;
          t2.pts += 1;
        }
      });

      // Criterio 2: Scontro diretto (punti e differenza reti negli incontri diretti)
      const getHeadToHead = (idA, idB) => {
        let ptsA = 0;
        let ptsB = 0;
        let gdA = 0;
        let gdB = 0;

        completedGroupMatches.forEach((m) => {
          if ((m.t1 === idA && m.t2 === idB) || (m.t1 === idB && m.t2 === idA)) {
            const s1 = parseInt(m.s1, 10);
            const s2 = parseInt(m.s2, 10);
            if (isNaN(s1) || isNaN(s2)) return;

            const scoreA = m.t1 === idA ? s1 : s2;
            const scoreB = m.t1 === idB ? s1 : s2;
            const max = Math.max(scoreA, scoreB);

            gdA += scoreA - scoreB;
            gdB += scoreB - scoreA;

            if (scoreA > scoreB) {
              if (max <= 10) ptsA += 3;
              else {
                ptsA += 2;
                ptsB += 1;
              }
            } else if (scoreB > scoreA) {
              if (max <= 10) ptsB += 3;
              else {
                ptsB += 2;
                ptsA += 1;
              }
            }
          }
        });

        if (ptsB !== ptsA) return ptsB - ptsA;
        return gdB - gdA;
      };

      // Ordinamento: 1. Punti, 2. Scontro diretto, 3. Differenza reti complessiva, 4. Gol fatti
      return standings.sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        const h2h = getHeadToHead(a.id, b.id);
        if (h2h !== 0) return h2h;
        if (b.gd !== a.gd) return b.gd - a.gd;
        return b.gf - a.gf;
      });
    }

    function getGroupProgress(group) {
      if (!state.data) return { played: 0, total: 12 };
      const matches = Object.values(state.data.groupMatches).filter((m) => m.group === group);
      const played = matches.filter((m) => m.s1 !== '' && m.s2 !== '').length;
      return { played, total: matches.length };
    }

    function isGroupFinished(group) {
      const { played, total } = getGroupProgress(group);
      return total > 0 && played === total;
    }

    function getKoTeams() {
      if (!state.data) return null;

      const sA = calculateStandings('A');
      const sB = calculateStandings('B');
      const sC = calculateStandings('C');
      const sD = calculateStandings('D');

      const getT = (groupStr, standingsList, pos) => {
        return isGroupFinished(groupStr)
          ? { id: standingsList[pos - 1].id, name: standingsList[pos - 1].name }
          : { id: null, name: `${pos}ª Girone ${groupStr}` };
      };

      const qf = {
        QF1: { t1: getT('A', sA, 1), t2: getT('B', sB, 2) },
        QF2: { t1: getT('C', sC, 1), t2: getT('D', sD, 2) },
        QF3: { t1: getT('B', sB, 1), t2: getT('A', sA, 2) },
        QF4: { t1: getT('D', sD, 1), t2: getT('C', sC, 2) }
      };

      const getWinner = (matchId, t1Info, t2Info, label) => {
        const m = state.data.koMatches[matchId];
        if (!m || m.s1 === '' || m.s2 === '') return { id: null, name: label };
        const s1 = parseInt(m.s1, 10);
        const s2 = parseInt(m.s2, 10);
        if (isNaN(s1) || isNaN(s2) || s1 === s2) return { id: null, name: label };
        return s1 > s2 ? t1Info : t2Info;
      };

      const sf = {
        SF1: {
          t1: getWinner('QF1', qf.QF1.t1, qf.QF1.t2, 'Vincitrice Quarto 1'),
          t2: getWinner('QF2', qf.QF2.t1, qf.QF2.t2, 'Vincitrice Quarto 2')
        },
        SF2: {
          t1: getWinner('QF3', qf.QF3.t1, qf.QF3.t2, 'Vincitrice Quarto 3'),
          t2: getWinner('QF4', qf.QF4.t1, qf.QF4.t2, 'Vincitrice Quarto 4')
        }
      };

      const f = {
        F: {
          t1: getWinner('SF1', sf.SF1.t1, sf.SF1.t2, 'Vincitrice Semifinale 1'),
          t2: getWinner('SF2', sf.SF2.t1, sf.SF2.t2, 'Vincitrice Semifinale 2')
        }
      };

      return { ...qf, ...sf, ...f };
    }

    // --- Salvataggio Dati su Firebase Firestore ---
    async function updateMatchScore(matchPath, s1, s2) {
      if (!state.isAdmin || !state.data) return;

      const [section, key] = matchPath.split('.');
      const currentMatch = state.data[section][key];
      if (currentMatch.s1 === s1 && currentMatch.s2 === s2) return;

      // Aggiornamento ottimistico immediato
      state.data[section][key] = { ...currentMatch, s1, s2 };
      renderApp();

      if (!db) {
        showToast('Errore: Database Firebase non inizializzato');
        return;
      }

      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tournament_state', 'main');
      try {
        await updateDoc(docRef, {
          [`${matchPath}.s1`]: s1,
          [`${matchPath}.s2`]: s2
        });
        state.cloudStatus = 'connected';
        updateCloudBadge();
        showToast('Risultato salvato su Firebase in tempo reale');
      } catch (e) {
        try {
          await setDoc(docRef, state.data, { merge: true });
          state.cloudStatus = 'connected';
          updateCloudBadge();
          showToast('Risultato salvato su Firebase in tempo reale');
        } catch (err) {
          console.error('Errore scrittura Firestore:', err);
          state.cloudStatus = 'error';
          updateCloudBadge();
          showToast('Permesso negato su Firebase: verifica Regole Firestore e Auth Anonima');
        }
      }
    }

    async function saveTeamName(teamId, newName) {
      if (!state.isAdmin || !teamId || !newName.trim() || !state.data) return;
      const trimmed = newName.trim();

      state.data.teams[teamId] = { name: trimmed };
      renderApp();

      if (!db) {
        showToast('Errore: Database Firebase non inizializzato');
        return;
      }

      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tournament_state', 'main');
      try {
        await updateDoc(docRef, {
          [`teams.${teamId}.name`]: trimmed
        });
        state.cloudStatus = 'connected';
        updateCloudBadge();
        showToast('Nome squadra salvato su Firebase');
      } catch (e) {
        try {
          await setDoc(docRef, state.data, { merge: true });
          state.cloudStatus = 'connected';
          updateCloudBadge();
          showToast('Nome squadra salvato su Firebase');
        } catch (err) {
          console.error('Errore scrittura nome squadra su Firestore:', err);
          state.cloudStatus = 'error';
          updateCloudBadge();
          showToast('Permesso negato su Firebase: verifica Regole Firestore e Auth Anonima');
        }
      }
    }

    // --- PAGINA 2: CALENDARIO ---
    function renderCalendarioPage() {
      const groupMatches = Object.entries(state.data.groupMatches)
        .filter(([_, m]) => m.group === state.calendarGroup)
        .map(([k, m]) => ({ key: k, ...m }));

      const allRounds = [1, 2, 3, 4, 5, 6].map((r) => ({
        round: r,
        leg: r <= 3 ? 'Andata' : 'Ritorno',
        matches: groupMatches.filter((m) => m.round === r)
      }));

      const visibleRounds = allRounds.filter((r) => {
        if (state.legFilter === 'Tutte') return true;
        return r.leg === state.legFilter;
      });

      const legButtonsHtml = ['Tutte', 'Andata', 'Ritorno']
        .map(
          (filter) => `
          <button type="button" data-leg-filter="${filter}" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all ${
            state.legFilter === filter
              ? 'bg-white text-blue-600 shadow-sm'
              : 'text-slate-600 hover:text-slate-900'
          }">
            ${filter}
          </button>
        `
        )
        .join('');

      const groupTabsHtml = ['A', 'B', 'C', 'D']
        .map((g) => {
          const { played, total } = getGroupProgress(g);
          const isSelected = state.calendarGroup === g;
          const dotHtml =
            played === total
              ? `<span class="w-2.5 h-2.5 rounded-full ${isSelected ? 'bg-emerald-300' : 'bg-emerald-500'}" title="Tutte le partite completate"></span>`
              : '';

          return `
            <button type="button" data-cal-group="${g}" class="p-3.5 rounded-xl font-bold transition-all border text-left flex items-center justify-between ${
              isSelected
                ? 'bg-blue-600 text-white border-blue-600 shadow-md'
                : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
            }">
              <div>
                <div class="text-base sm:text-lg">Girone ${g}</div>
                <div class="text-xs font-medium ${isSelected ? 'text-blue-100' : 'text-slate-400'}">
                  ${played}/${total} giocate
                </div>
              </div>
              ${dotHtml}
            </button>
          `;
        })
        .join('');

      const roundsCardsHtml = visibleRounds
        .map(
          (r) => `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
            <div class="bg-slate-50 px-4 py-3 border-b border-slate-200/80 flex items-center justify-between">
              <span class="font-bold text-slate-800">
                Girone ${state.calendarGroup} • Giornata ${r.round}
              </span>
              <span class="text-xs font-bold px-3 py-1 rounded-full ${
                r.leg === 'Andata' ? 'bg-blue-100 text-blue-700' : 'bg-indigo-100 text-indigo-700'
              }">
                ${r.leg}
              </span>
            </div>
            <div>
              ${r.matches.map((m) => renderMatchRow(m)).join('')}
            </div>
          </div>
        `
        )
        .join('');

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl sm:text-2xl font-black text-slate-800">
                Calendario Partite • Andata e Ritorno
              </h2>
              <p class="text-sm text-slate-500 mt-0.5">
                Seleziona uno dei 4 gironi per consultare tutte le giornate di andata e ritorno.
              </p>
            </div>
            <div class="flex bg-slate-100 p-1 rounded-xl self-start sm:self-auto">
              ${legButtonsHtml}
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            ${groupTabsHtml}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            ${roundsCardsHtml}
          </div>
        </div>
      `;
    }

        finalMatch.s1 !== '' && finalMatch.s2 !== '' && !isNaN(f1) && !isNaN(f2) && f1 !== f2

            : koTeams.F.t2
          : null;

        champion && champion.id
          ? `
            <div class="bg-gradient-to-r from-amber-500 to-yellow-500 text-white rounded-2xl p-5 shadow-lg flex items-center justify-center gap-4">

    // --- Render Barra di Navigazione ---
    function renderNavigation() {
      const navPages = [
        { id: 'tabellone', label: 'Tabellone', icon: ICONS.layoutGrid(16) },
        { id: 'calendario', label: 'Calendario', icon: ICONS.calendar(16) },
        { id: 'classifiche', label: 'Classifiche', icon: ICONS.barChart(16) },
        { id: 'fase_finale', label: 'Fase finale', icon: ICONS.trophy(16) },
        { id: 'regolamento', label: 'Regolamento', icon: ICONS.bookOpen(16) }
      ];

      const navContainer = document.getElementById('main-nav');
      if (!navContainer) return;

      navContainer.innerHTML = navPages
        .map((page) => {
          const isCurrent = state.activePage === page.id;
          return `
            <button type="button" data-nav-page="${page.id}" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm whitespace-nowrap transition-all ${
              isCurrent
                ? 'bg-blue-600 text-white shadow-sm'
                : 'bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 border border-slate-200/80'
            }">
              ${page.icon}
              <span>${page.label}</span>
            </button>
          `;
        })
        .join('');
    }

    // --- Render Generale dell'Applicazione ---
    function renderApp() {
      renderNavigation();
      updateAdminButton();
      updateCloudBadge();

      const mainEl = document.getElementById('app-main');
      if (!mainEl || !state.data) return;

      switch (state.activePage) {
        case 'tabellone':
          mainEl.innerHTML = renderTabellonePage();
          break;
        case 'calendario':
          mainEl.innerHTML = renderCalendarioPage();
          break;
        case 'classifiche':
          mainEl.innerHTML = renderClassifichePage();
          break;
        case 'fase_finale':
          mainEl.innerHTML = renderFaseFinalePage();
          break;
        case 'regolamento':
          mainEl.innerHTML = renderRegolamentoPage();
          break;
        default:
          mainEl.innerHTML = renderTabellonePage();
      }
    }

    // --- Event Delegation Globale ---
    document.addEventListener('click', (e) => {
      // Cambio pagina dalla barra principale
      const navBtn = e.target.closest('[data-nav-page]');
      if (navBtn) {
        state.activePage = navBtn.getAttribute('data-nav-page');
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Cambio pagina rapido da link interni
      const gotoBtn = e.target.closest('[data-goto-page]');
      if (gotoBtn) {
        state.activePage = gotoBtn.getAttribute('data-goto-page');
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Apertura diretta partite di un girone dal Tabellone
      const gotoGroupBtn = e.target.closest('[data-goto-group]');
      if (gotoGroupBtn) {
        state.calendarGroup = gotoGroupBtn.getAttribute('data-goto-group');
        state.activePage = 'calendario';
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Cambio tab Girone nel Calendario
      const calGroupBtn = e.target.closest('[data-cal-group]');
      if (calGroupBtn) {
        state.calendarGroup = calGroupBtn.getAttribute('data-cal-group');
        renderApp();
        return;
      }

      // Filtro Andata / Ritorno nel Calendario
      const legBtn = e.target.closest('[data-leg-filter]');
      if (legBtn) {
        state.legFilter = legBtn.getAttribute('data-leg-filter');
        renderApp();
        return;
      }

      // Scorrimento rapido sezioni Regolamento
      const scrollBtn = e.target.closest('[data-scroll-to]');
      if (scrollBtn) {
        const targetId = scrollBtn.getAttribute('data-scroll-to');
        const el = document.getElementById(targetId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      // Apertura modale modifica nome squadra (Admin)
      const editTeamBtn = e.target.closest('[data-edit-team]');
      if (editTeamBtn && state.isAdmin) {
        const teamId = editTeamBtn.getAttribute('data-edit-team');
        state.editingTeamId = teamId;
        const input = document.getElementById('input-team-name');
        const modal = document.getElementById('modal-edit-team');
        if (input && modal) {
          input.value = state.data.teams[teamId]?.name || '';
          modal.classList.remove('hidden');
          input.focus();
        }
        return;
      }
    });

    // Gestione salvataggio punteggi su blur (uscita dal campo)
    document.addEventListener(
      'blur',
      (e) => {
        if (e.target.classList.contains('group-score-input')) {
          const matchKey = e.target.getAttribute('data-group-match');
          const inputs = document.querySelectorAll(`.group-score-input[data-group-match="${matchKey}"]`);
          if (inputs.length === 2) {
            updateMatchScore(`groupMatches.${matchKey}`, inputs[0].value, inputs[1].value);
          }
        } else if (e.target.classList.contains('ko-score-input')) {
          const matchId = e.target.getAttribute('data-ko-match');
          const inputs = document.querySelectorAll(`.ko-score-input[data-ko-match="${matchId}"]`);
          if (inputs.length === 2) {
            updateMatchScore(`koMatches.${matchId}`, inputs[0].value, inputs[1].value);
          }
        }
      },
      true
    );

    // Conferma punteggio premendo Invio
    document.addEventListener('keydown', (e) => {
      if (
        e.key === 'Enter' &&
        (e.target.classList.contains('group-score-input') || e.target.classList.contains('ko-score-input'))
      ) {
        e.target.blur();
      }
    });

    // --- Pulsante Condividi Link ---
    document.getElementById('btn-share').addEventListener('click', async () => {
      const url = window.location.href;
      try {
        await navigator.clipboard.writeText(url);
        showToast('Link copiato! Condividilo con i partecipanti.');
      } catch {
        const tempInput = document.createElement('input');
        tempInput.value = url;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast('Link copiato! Condividilo con i partecipanti.');
      }
    });

    // --- Gestione Modale Admin ---
    const adminModal = document.getElementById('modal-admin');
    const adminPwdInput = document.getElementById('input-admin-pwd');
    const adminErrorText = document.getElementById('admin-login-error');

    document.getElementById('btn-admin').addEventListener('click', () => {
      if (state.isAdmin) {
        state.isAdmin = false;
        showToast('Modalità Admin disattivata');
        renderApp();
      } else {
        adminErrorText.classList.add('hidden');
        adminPwdInput.className = 'w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all';
        adminPwdInput.value = '';
        adminModal.classList.remove('hidden');
        adminPwdInput.focus();
      }
    });

    document.getElementById('close-admin-modal').addEventListener('click', () => {
      adminModal.classList.add('hidden');
    });

    document.getElementById('form-admin-login').addEventListener('submit', (e) => {
      e.preventDefault();
      if (adminPwdInput.value === 'TuaPasswordSegreta2026') {
        state.isAdmin = true;
        adminModal.classList.add('hidden');
        adminPwdInput.value = '';
        adminErrorText.classList.add('hidden');
        showToast('Modalità Admin attivata: ogni modifica viene salvata su Firebase');
        renderApp();
      } else {
        adminErrorText.classList.remove('hidden');
        adminPwdInput.className = 'w-full px-4 py-2.5 border border-rose-400 focus:ring-2 focus:ring-rose-500 bg-rose-50/30 rounded-lg outline-none transition-all';
        adminPwdInput.value = '';
        adminPwdInput.focus();
      }
    });

    // --- Gestione Modale Modifica Nome Squadra ---
    const editTeamModal = document.getElementById('modal-edit-team');
    const teamNameInput = document.getElementById('input-team-name');

    const closeEditTeamModal = () => {
      editTeamModal.classList.add('hidden');
      state.editingTeamId = null;
    };

    document.getElementById('close-edit-team-modal').addEventListener('click', closeEditTeamModal);
    document.getElementById('cancel-edit-team').addEventListener('click', closeEditTeamModal);

    document.getElementById('form-edit-team').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (state.editingTeamId && teamNameInput.value.trim()) {
        const id = state.editingTeamId;
        const val = teamNameInput.value;
        closeEditTeamModal();
        await saveTeamName(id, val);
      }
    });

    // --- Avvio Connessione Firebase & Sincronizzazione Real-Time ---
    const CACHE_KEY = 'biliardino_pro_cache_v1';

    function loadCachedData() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveCachedData(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      } catch {}
    }

    function startFirestoreListener() {
      if (!db) {
        state.cloudStatus = 'error';
        updateCloudBadge();
        return;
      }

      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tournament_state', 'main');
      onSnapshot(
        docRef,
        (docSnap) => {
          state.cloudStatus = 'connected';
          if (docSnap.exists()) {
            const remoteData = docSnap.data();
            const updatedTeams = { ...(remoteData.teams || {}) };
            let needsMigration = false;
            for (let i = 1; i <= 16; i++) {
              const id = i.toString();
              if (!updatedTeams[id] || updatedTeams[id].name === `Squadra ${i}`) {
                updatedTeams[id] = { name: DEFAULT_TEAM_NAMES[id] };
                needsMigration = true;
              }
            }
            if (needsMigration) {
              updateDoc(docRef, { teams: updatedTeams }).catch(() => {});
              state.data = { ...remoteData, teams: updatedTeams };
            } else {
              state.data = remoteData;
            }
          } else {
            const fresh = createDefaultData();
            state.data = fresh;
            setDoc(docRef, fresh).catch((err) => {
              console.error('Errore creazione documento iniziale su Firestore:', err);
              state.cloudStatus = 'error';
              updateCloudBadge();
            });
          }
          saveCachedData(state.data);
          renderApp();
        },
        (error) => {
          console.error('Errore connessione Firestore:', error);
          state.cloudStatus = 'error';
          updateCloudBadge();
        }
      );
    }

    async function bootstrap() {
      // 1. Mostra subito il tabellone senza attendere la rete
      state.data = loadCachedData() || createDefaultData();
      renderApp();

      if (!db) {
        state.cloudStatus = 'error';
        updateCloudBadge();
        return;
      }

      // 2. Avvia immediatamente l'ascolto real-time di Firestore in parallelo
      startFirestoreListener();

      // 3. Esegue il login anonimo in background per abilitare le scritture Admin
      if (auth) {
        onAuthStateChanged(auth, (currentUser) => {
          if (currentUser) state.user = currentUser;
        });
        signInAnonymously(auth).catch((error) => {
          console.warn('Accesso anonimo Firebase non riuscito:', error.message);
        });
      }
    }

    bootstrap();
  </script>
</body>
</html>
